<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hornets by TAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --bg:#f4f5fa;--panel:#fff;--panel2:#f0f1f7;--line:#e2e4ee;--text:#16142b;--muted:#6b6a82;
 --pur:#1d1160;--pur2:#2c1d86;--pur3:#3d2bb0;--teal:#00788c;--teal2:#00a3b8;--teals:#dff4f6;
 --ok:#11906a;--oks:#ddf4ea;--warn:#c27a06;--warns:#fdf0d8;--bad:#cf3b3b;--bads:#fbe5e5;
 --hot:#e4572e;--sh:0 1px 2px rgba(20,16,60,.06),0 8px 24px rgba(20,16,60,.07);
 --hd:"Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#140b45 0%,var(--pur) 45%,#241478 100%);color:#e7e4ff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(20,10,70,.2)}
.brand{padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.brand .nm{font:800 26px/1 var(--hd);letter-spacing:.02em;color:#fff;text-transform:uppercase}
.brand .nm i{font-style:normal;color:var(--teal2)}
.brand .by{font-size:11.5px;color:#a9a3e0;margin-top:5px}
.brand .by b{color:#7fe3ef}
.grp{font:700 11px var(--hd);letter-spacing:.14em;text-transform:uppercase;color:#7fe3ef;opacity:.85;margin:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:0;background:none;color:#cfcaf5;cursor:pointer;text-align:left;width:100%;font-weight:600;font-size:13.5px}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:linear-gradient(90deg,rgba(0,163,184,.28),rgba(0,163,184,.08));color:#fff;box-shadow:inset 3px 0 0 var(--teal2)}
.nav .badge{margin-left:auto;background:var(--hot);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:800}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;color:#a9a3e0;display:flex;flex-direction:column;gap:8px}
.side .chg{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:12.5px;text-align:left}
.side .chg:hover{background:rgba(255,255,255,.14)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.tick{background:#0f0838;color:#fff;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--teal);position:sticky;top:0;z-index:20;height:36px;display:flex;align-items:center}
.scores{background:linear-gradient(90deg,#00505d,#00788c);color:#fff;height:34px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;position:sticky;top:0;z-index:21}
.scores .lab{flex:none;background:#0f0838;font:800 13px var(--hd);letter-spacing:.1em;padding:0 12px;height:100%;display:flex;align-items:center;text-transform:uppercase}
.scores .rail{overflow:hidden;flex:1;height:100%}.scores .mq{display:inline-flex;gap:22px;padding-left:18px;height:100%;align-items:center;animation:mq 55s linear infinite}.scores:hover .mq{animation-play-state:paused}@media (prefers-reduced-motion:reduce){.scores .mq{animation:none}}
.sg2{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;background:none;border:0;color:#fff;cursor:default}
button.sg2{cursor:pointer}button.sg2:hover b{text-decoration:underline}
.sg2 .w{background:#3ee08f;color:#063b26;border-radius:4px;padding:0 5px;font:800 12px var(--hd)}
.sg2 .h{background:rgba(255,255,255,.18);border-radius:4px;padding:0 5px;font:700 11px var(--hd);letter-spacing:.06em}
.sg2 .t{color:#c9f6fc}
.tick{top:34px}
.tick .lab{flex:none;background:var(--hot);font:800 13px var(--hd);letter-spacing:.1em;padding:0 12px;height:100%;display:flex;align-items:center;text-transform:uppercase}
.tick .rail{overflow:hidden;flex:1;position:relative;height:100%}
.tick .mq{display:inline-flex;gap:28px;padding-left:20px;height:100%;align-items:center;animation:mq 70s linear infinite}
.tick:hover .mq{animation-play-state:paused}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{background:none;border:0;color:#e9e6ff;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-size:12.5px}
.ti b{color:#fff}.ti .sc{background:var(--hot);border-radius:4px;padding:0 5px;font-weight:800;font-size:11px}
.ti .sg{color:#7fe3ef}.ti .ago{color:#8f89c4}
@media (prefers-reduced-motion:reduce){.tick .mq{animation:none}}
main{padding:22px 26px 90px;max-width:1380px;width:100%}
.hero{position:relative;border-radius:14px;padding:20px 24px;margin-bottom:16px;color:#fff;background:linear-gradient(115deg,#140b45 0%,var(--pur2) 55%,var(--teal) 140%);box-shadow:var(--sh);overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.hero h1{font:800 32px/1 var(--hd);letter-spacing:.01em;text-transform:uppercase}
.hero p{color:#d8d4ff;font-size:13px;margin-top:4px;max-width:720px}
.hero .sp{flex:1}
.hero .x{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warns);border:1px solid #f3d9a6;border-left:4px solid var(--warn);border-radius:10px;padding:9px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner b{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:16px}
.card h3{font:800 17px var(--hd);letter-spacing:.03em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-dash{grid-template-columns:1.35fr 1fr}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font:800 34px/1.1 var(--hd);margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:700;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:#006575}
.btn.pur{background:var(--pur2);border-color:var(--pur2);color:#fff}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.warn{background:var(--warns);color:var(--warn)}.pill.bad{background:var(--bads);color:var(--bad)}
.pill.teal{background:var(--teals);color:var(--teal)}.pill.pur{background:#e9e5ff;color:var(--pur2)}.pill.hot{background:#fde6de;color:var(--hot)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.chip.on{background:var(--pur2);border-color:var(--pur2);color:#fff}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:12px}
.link{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:0;text-align:left}
.link:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f8f8fd}
.tbl{overflow-x:auto}
.ring{--p:50;--c:var(--teal);width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:5px;background:var(--panel);border-radius:50%}
.ring b{position:relative;font:800 16px var(--hd)}
.ring.big{width:74px;height:74px}.ring.big::before{inset:8px}.ring.big b{font-size:26px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
textarea.input{min-height:70px;resize:vertical}
.input:focus{outline:2px solid var(--teal2);outline-offset:0;border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* dialer */
.dl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0f0838;color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.dl-top .live{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--hd);letter-spacing:.08em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:#6c6a85}
.dot.on{background:#3ee08f;box-shadow:0 0 0 4px rgba(62,224,143,.25);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(62,224,143,0)}}
.dl-stat{display:flex;flex-direction:column;padding:0 12px;border-left:1px solid rgba(255,255,255,.14)}
.dl-stat b{font:800 22px/1 var(--hd)}.dl-stat span{font-size:11px;color:#a9a3e0;text-transform:uppercase;letter-spacing:.05em}
.dl-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}.grid>*,.dl-grid>*{min-width:0}
.now{border-top:4px solid var(--teal)}
.now h2{font:800 30px/1.05 var(--hd);text-transform:uppercase}
.callbox{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:10px;padding:10px 12px;margin:12px 0}
.callbox .num{font:700 20px var(--hd);letter-spacing:.04em}
.callbox .st{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.st.ring1{color:var(--warn)}.st.conn{color:var(--ok)}.st.idle{color:var(--muted)}
.why{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.why div{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.why .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.script{background:#faf9ff;border:1px solid #e3defd;border-radius:10px;padding:12px;font-size:13.5px;line-height:1.55}
.script .op{font-size:15px;font-weight:600;color:var(--pur)}
.script ul{padding-left:18px;margin-top:4px}
.obj{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.objt{margin-top:8px;background:#fff;border-left:3px solid var(--teal);padding:8px 10px;border-radius:6px;font-size:13px}
.outs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.out{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 8px;cursor:pointer;font-weight:700;font-size:12.5px;display:flex;gap:7px;align-items:center}
.out kbd{background:var(--panel2);border-radius:5px;padding:0 6px;font:700 12px var(--hd);color:var(--muted)}
.out:hover{border-color:var(--teal2)}
.out.on{border-color:var(--teal);background:var(--teals);color:#004d5a}
.out.on kbd{background:var(--teal);color:#fff}
.out.dnc.on{border-color:var(--bad);background:var(--bads);color:var(--bad)}
kbd.k{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:700 12px var(--hd)}
.upnext{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.upnext .u{flex:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:170px;cursor:pointer;text-align:left}
.cd{background:var(--teals);border:1px solid #b6e3ea;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;color:#00505d}
.comp{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* pipeline */
.kb{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel2);border-radius:12px;padding:10px;min-height:300px}
.col.over{outline:2px dashed var(--teal2)}
.col h4{font:800 15px var(--hd);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center;margin-bottom:8px}
.col h4 small{margin-left:auto;font:600 12px Inter;color:var(--muted)}
.dc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dc .t{font-weight:700;font-size:13px}
/* events */
.ev{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.evd{background:linear-gradient(160deg,var(--pur),var(--pur3));color:#fff;border-radius:10px;text-align:center;padding:6px 0}
.evd .m{font:700 12px var(--hd);letter-spacing:.12em;text-transform:uppercase;color:#7fe3ef}
.evd .d{font:800 30px/1 var(--hd)}
.evd .w{font-size:11px;color:#cfcaf5}
.evd.game{background:linear-gradient(160deg,#00505d,var(--teal))}
.evd.game .m{color:#c9f6fc}
/* social */
.post{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.post .ph{display:flex;gap:9px;align-items:center;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pur2),var(--teal));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.post .tx{padding:0 12px 10px;font-size:13px;white-space:pre-line}
.post .img{height:150px;background:radial-gradient(circle at 80% 20%,rgba(0,163,184,.55),transparent 55%),linear-gradient(135deg,#140b45,var(--pur2));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;position:relative;overflow:hidden}
.post .img::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px)}
.post .img .a{font:700 12px var(--hd);letter-spacing:.14em;color:#7fe3ef;text-transform:uppercase;position:relative}
.post .img .b{font:800 26px/1 var(--hd);text-transform:uppercase;position:relative}
.post .pf{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:#fafafe}
/* drawer & panels */
.scrim{position:fixed;inset:0;background:rgba(15,8,56,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:var(--panel);z-index:45;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(15,8,56,.2)}
.drawer.show{transform:none}
.dh{padding:16px 18px;background:linear-gradient(115deg,#140b45,var(--pur2));color:#fff;display:flex;gap:12px;align-items:center}
.dh h2{font:800 24px/1.05 var(--hd);text-transform:uppercase}
.dh .sub{color:#cfcaf5}
.dh .ring b{color:var(--text)}
.dh .x{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
.db{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sec h4{font:800 13px var(--hd);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ask{position:fixed;right:20px;bottom:20px;z-index:35;background:linear-gradient(135deg,var(--pur2),var(--teal));color:#fff;border:0;border-radius:99px;padding:12px 18px;font:800 15px var(--hd);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(29,17,96,.35);display:flex;gap:8px;align-items:center}
.askp{position:fixed;right:20px;bottom:76px;width:min(380px,calc(100vw - 32px));height:min(520px,calc(100vh - 120px));background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,8,56,.3);z-index:46;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.askp.show{display:flex}
.askp .hd{background:linear-gradient(115deg,#140b45,var(--pur2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;font:800 17px var(--hd);letter-spacing:.05em;text-transform:uppercase}
.askp .hd button{margin-left:auto;background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8f8fd}
.m{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13px}
.m.u{align-self:flex-end;background:var(--pur2);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.a .btn{margin-top:6px}
.askp form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:rgba(15,8,56,.4);padding:16px}
.modal.show{display:grid}
.modal .card{width:min(480px,100%)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f0838;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.mobnav{display:none}
#ncmap{width:100%;height:560px;display:block;background:linear-gradient(180deg,#e6f1f7,#dcecf4);border-radius:12px;border:1px solid var(--line);cursor:default}
.cty{stroke:#cfd3e6;stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .2s}
.cty.has{cursor:pointer}.cty.has:hover,.cty.sel{stroke:#1d1160;stroke-width:2}
.nst{fill:#fbfbfc;stroke:#d9dbe6;stroke-width:1;vector-effect:non-scaling-stroke}
.ncout{fill:none;stroke:#1d1160;stroke-width:2;vector-effect:non-scaling-stroke}
.arc{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:6 6;animation:flow 1.4s linear infinite;opacity:.75}
@keyframes flow{to{stroke-dashoffset:-12}}
.ring{fill:none;stroke:#1d1160;stroke-dasharray:3 5;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.45}
.mk{cursor:pointer;stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:2}
.pulse{transform-box:fill-box;transform-origin:center;animation:pz 1.8s ease-out infinite;fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes pz{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.clab{font:700 11px Inter;fill:#3a3858;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.clab.big{font:800 13px 'Barlow Condensed',sans-serif;letter-spacing:.06em;fill:#1d1160;text-transform:uppercase}
.mapgrid{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:1000px){.mapgrid{grid-template-columns:1fr}#ncmap{height:420px}}
@media (prefers-reduced-motion:reduce){.arc,.pulse{animation:none}}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- scoring ---------- */
function evDate(e){return e.at.length>10?new Date(e.at):new Date(e.at+'T19:00')}
function daysTo(e){return Math.ceil((new Date(e.at.slice(0,10)+'T12:00')-new Date(TODAY+'T12:00'))/86400000)}
function upcoming(){return EVENTS.filter(e=>daysTo(e)>=0)}
function segTags(c){const a=AC(c.acct);if(c.seg==='premium')return['premium','client'];if(c.seg==='corp-new')return['team','holiday','yp'];if(c.seg==='corp')return['holiday','client','team'];
 return a.gk==='church'?['church','family']:a.gk==='alumni'?['alumni','group']:['family','group']}
function bestEvent(c){const tags=segTags(c);const ev=upcoming().filter(e=>daysTo(e)>=2&&e.tags.some(t=>tags.includes(t)));
 ev.sort((x,y)=>{const sx=tags.indexOf(x.tags.find(t=>tags.includes(t))),sy=tags.indexOf(y.tags.find(t=>tags.includes(t)));return (daysTo(x)+sx*6)-(daysTo(y)+sy*6)});return ev[0]||upcoming()[0]}
function recProd(c){const e=bestEvent(c);if(c.seg==='premium')return 'suite';if(c.seg==='group')return 'group';if(e&&e.tags.includes('holiday'))return 'event';return c.seg==='corp-new'?'event':'group'}
function score(c){
 const a=AC(c.acct);
 let fit=a.tier==='A'?30:a.tier==='B'?22:18;if(c.seg==='premium')fit+=4;
 let sig=a.tier==='A'?24:a.tier==='B'?12:11;
 let eng=0;(c.ev||[]).forEach(e=>{const d=ENG.find(x=>x[0]===e.k);if(d)eng+=d[2]});eng=Math.min(eng,22);
 const be=bestEvent(c);const dt=be?daysTo(be):60;const tim=dt<=10?16:dt<=21?12:dt<=35?8:4;
 let s=fit+sig+eng+tim;if(!c.emailOk&&!c.phone)s-=10;return Math.max(5,Math.min(99,s));
}
function temp(s){return s>=80?'hot':s>=65?'warm':'cool'}
function whyNow(c){const a=AC(c.acct);const e=bestEvent(c);const out=[];
 out.push(['sig',a.sig]);
 (c.ev||[]).slice().sort((x,y)=>y.t-x.t).slice(0,2).forEach(x=>{const d=ENG.find(z=>z[0]===x.k);if(d)out.push(['eng',d[1]+(['past','lapsed'].includes(x.k)?'':' · '+ago(x.t))])});
 if(e)out.push(['ev','Best fit: '+e.t+' · '+fdate(e.at.slice(0,10))+' ('+dd(daysTo(e))+')']);return out}

const D={status:'idle',t0:0,out:null,prod:null,note:'',skip:{},force:null,evF:'',segF:'',auto:false,cd:0,cdH:null,tH:null,objOpen:-1};
function loggedToday(cid){return DB.logs.some(l=>l.cid===cid&&l.day===TODAY)}
function queue(){
 let q=DB.contacts.filter(c=>!DB.dnc[c.id]&&!['Won','Not now'].includes(c.status)&&!loggedToday(c.id)&&!D.skip[c.id]&&!(c.real&&!c.phone));
 if(D.evF)q=q.filter(c=>{const e=EVENTS.find(x=>x.id===D.evF);return e&&e.tags.some(t=>segTags(c).includes(t))});
 if(D.segF)q=q.filter(c=>c.seg===D.segF);
 q.sort((a,b)=>score(b)-score(a));
 if(D.force){const i=q.findIndex(c=>c.id===D.force);if(i>0)q.unshift(q.splice(i,1)[0]);else if(i<0){const c=CT(D.force);if(c&&!DB.dnc[c.id])q.unshift(c)}}
 return q}
function curC(){return queue()[0]}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+pad(s%60)}
function inWindow(){const h=new Date().getHours();return h>=8&&h<21}

 if(!c)return hero('Power Dialer','One click per call. Qualified leads only, ranked by who to call before which event.')+top+`<div class="card empty">Queue is empty for this filter. Clear the filter, or upload a ZoomInfo list.</div>`;
 const a=AC(c.acct);const sc=score(c);const e=bestEvent(c);

 const hist=DB.logs.filter(l=>l.cid===c.id).slice(-3).reverse();
 return hero('Power Dialer','One click per call. Qualified leads only, ranked by who to call before which event.',`<span class="pill keys" style="background:rgba(255,255,255,.14);color:#fff">Keys: <kbd class="k">D</kbd> dial · <kbd class="k">1</kbd>–<kbd class="k">8</kbd> outcome · <kbd class="k">Enter</kbd> save &amp; next · <kbd class="k">V</kbd> voicemail · <kbd class="k">S</kbd> skip</span>`)+top+
 (D.cd>0?`<div class="cd">⏭ Dialing ${esc(nameOf(c))} in <b id="cdn">${D.cd}</b>s<span class="sp"></span><button class="btn sm" data-act="skip">Skip</button><button class="btn sm" data-act="stop-auto">Pause</button></div>`:'')+

   <div class="sec" style="margin-top:12px"><h4>Recommend</h4><div class="row"><span class="pill teal">${prodName(recProd(c))}</span><span class="pill">est. ${money(prodVal(recProd(c)))}</span>${snBtn(c,true)}${c.emailOk?'<span class="pill ok">Email verified</span>':'<span class="pill warn">No verified email</span>'}</div></div>
   ${hist.length?`<div class="sec" style="margin-top:12px"><h4>History</h4>${hist.map(l=>`<div class="sub">${new Date(l.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${esc((OUTCOMES.find(o=>o[0]===l.out)||[,''])[1])}${l.note?' · '+esc(l.note):''}</div>`).join('')}</div>`:''}
   <div class="comp"><span class="pill ok">DNC scrubbed ✓</span><span class="pill">NC number · one-party consent</span><span class="pill ${inWindow()?'ok':'warn'}">${inWindow()?'Inside 8 AM–9 PM window':'Outside calling window'}</span><span class="pill">One line at a time</span></div>
  </div>
  <div class="grid" style="align-content:start">
   <div class="card"><h3>Script<span class="sp"></span><span class="pill pur">${esc({premium:'Premium / C-suite','corp-new':'New to Charlotte',corp:'Corporate',group:'Group'}[c.seg])}</span></h3>
    <div class="script"><div class="op">${esc(opener(c))}</div><div style="margin-top:8px;font-size:13px"><b style="color:var(--teal)">Icebreaker:</b> ${esc(latestNews()[0].hook)}</div><div style="margin-top:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Questions</div><ul>${QS[c.seg].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>

function followHint(o){return {book:'Creates the deal, a calendar-invite draft and moves them to Meeting set.',hot:'Queues an offer email draft for the best-fit event.',cb:'Books a callback task for tomorrow.',vm:'Logs the voicemail and retries in 2 days.',gk:'Logs the gatekeeper and a task to ask for the planner.',no:'Moves to nurture. Out of the dial queue.',wrong:'Flags the number for re-enrichment.',dnc:'Permanent. Removed from every queue.'}[o]}
function tickTimer(){clearInterval(D.tH);D.tH=setInterval(()=>{const el=document.getElementById('dl-timer');if(el&&(D.status==='live'||D.status==='wrap'))el.textContent=fmtT((D.tEnd||Date.now())-D.t0)},1000)}
function dial(){const c=curC();if(!c||D.status!=='idle')return;if(phoneKey()!=='taz')toast('Dialing through '+phoneName());D.status='ringing';DB.session.dials++;save();renderMain();
 setTimeout(()=>{if(D.status==='ringing'){D.status='live';D.t0=Date.now();renderMain()}},1600)}
function applyOutcome(c,out,prod,note,dur,follow){
 const talked=['book','hot','cb','no','gk'].includes(out)&&dur>0;if(talked)DB.session.conn++;DB.session.talk+=dur;
 DB.logs.push({cid:c.id,t:Date.now(),day:TODAY,out,prod,note,dur});
 const p=prod||recProd(c);const e=bestEvent(c);const an=AC(c.acct).n.replace(/^Sample: /,'');
 const addTask=(kind,title,due)=>DB.tasks.unshift({id:uid(),cid:c.id,kind,title,due,done:false,draft:kind==='draft'?draftFor(c,title):''});
 if(out==='book'){c.status='Meeting set';DB.session.meet++;let d=DB.deals.find(x=>x.cid===c.id&&!['Won','Lost'].includes(x.stage));
  if(!d){d={id:'d'+uid(),cid:c.id,prod:p,val:prodVal(p),stage:'Meeting set',owner:c.owner,at:Date.now()};DB.deals.push(d);DB.session.added+=d.val}else d.stage='Meeting set';
  addTask('draft','Calendar invite + recap for '+nameOf(c),TODAY)}
 if(out==='hot'){c.status='Contacted';addTask('draft','Offer: '+(e?e.t.split(' · ')[0]:prodName(p))+' for '+an,TODAY);
  if(!DB.deals.some(x=>x.cid===c.id)){const d={id:'d'+uid(),cid:c.id,prod:p,val:prodVal(p),stage:'Contacted',owner:c.owner,at:Date.now()};DB.deals.push(d);DB.session.added+=d.val}}
 if(out==='cb'){c.status='Contacted';addTask('call','Callback: '+nameOf(c),follow||addDays(1))}
 if(out==='vm'){c.status=c.status==='New'?'Contacted':c.status;addTask('call','Retry after voicemail: '+nameOf(c),follow||addDays(2))}
 if(out==='gk'){addTask('call','Ask for the event planner at '+an,follow||addDays(1))}
 if(follow&&!['cb','vm','gk','dnc','wrong'].includes(out))addTask('call','Follow up: '+nameOf(c),follow);
 if(out==='no')c.status='Not now';
 if(out==='wrong')c.badPhone=true;
 if(out==='dnc')DB.dnc[c.id]=true;
 if(c.notes!==undefined&&note)c.notes=(c.notes?c.notes+'\n':'')+new Date().toLocaleDateString()+': '+note;
 save()}
function saveOutcome(){const c=curC();if(!c||!D.out)return;
 const dur=(D.status==='live'||D.status==='wrap')?(D.tEnd||Date.now())-D.t0:0;
 if(D.status==='idle')DB.session.dials++;
 const note=(document.getElementById('dl-note')||{}).value||'';const out=D.out;
 applyOutcome(c,out,D.prod,note,dur,'');
 toast('Saved: '+nameOf(c)+' · '+(OUTCOMES.find(o=>o[0]===out)||[,''])[1]);
 resetCall();if(D.force===c.id)D.force=null;
 if(D.auto)startCountdown();renderNav();renderMain();renderTick()}
function resetCall(){D.tEnd=0;D.status='idle';D.out=null;D.prod=null;D.note='';D.t0=0;D.objOpen=-1}
function startCountdown(){D.cd=3;clearInterval(D.cdH);D.cdH=setInterval(()=>{D.cd--;const el=document.getElementById('cdn');if(el)el.textContent=D.cd;if(D.cd<=0){clearInterval(D.cdH);D.cd=0;if(UI.view==='dialer'&&D.auto)dial()}},1000)}
function stopAuto(){D.auto=false;D.cd=0;clearInterval(D.cdH)}
function skip(){const c=curC();if(!c)return;D.skip[c.id]=true;if(D.force===c.id)D.force=null;resetCall();D.cd=0;clearInterval(D.cdH);if(D.auto)startCountdown();renderMain()}

/* =========================================================  WHY + ROI */
const ROI={reps:10,dials:100,conn:8,meet:15,close:25,deal:1800,extra:15,lift:2};
const ROIF=[['reps','Reps on the team',1,40,1,''],['dials','Dials per rep per day',40,200,5,''],['conn','Calls that reach a person',3,20,1,'%'],['meet','Conversations that become meetings',5,40,1,'%'],['close','Meetings that become sales',5,60,1,'%'],['deal','Average sale',500,10000,100,'$']];
const ROIA=[['extra','Extra dials per rep per day (no list building, auto-advance)',0,50,1,'+'],['lift','Connect-rate lift from ranked leads and local caller ID',0,5,.5,'pts']];
function roiCalc(){const r=ROI,days=21;const f=(d,c)=>{const conv=r.reps*d*days*c/100,m=conv*r.meet/100,sl=m*r.close/100;return {conv,m,sl,rev:sl*r.deal}};return {b:f(r.dials,r.conn),w:f(r.dials+r.extra,r.conn+r.lift)}}
const roiLab=(k,v,u)=>u==='$'?money(v):u==='%'?v+'%':u==='+'?'+'+v:u==='pts'?'+'+v+' pts':v;
function roiOut(){const {b,w}=roiCalc();const n=x=>Math.round(x).toLocaleString('en-US');
 const row=(l,x,y,m)=>`<tr><td>${l}</td><td>${m?money(x):n(x)}</td><td><b>${m?money(y):n(y)}</b></td><td style="color:var(--ok);font-weight:800">+${m?money(y-x):n(y-x)}</td></tr>`;
 return `<div class="roibig"><div><div class="l">Extra revenue per month</div><div class="v">${money(w.rev-b.rev)}</div></div><div><div class="l">Extra meetings per month</div><div class="v">+${n(w.m-b.m)}</div></div><div><div class="l">Extra conversations per month</div><div class="v">+${n(w.conv-b.conv)}</div></div></div>

 if(b.dataset.roi){const k=b.dataset.roi;ROI[k]=+b.value;const l=document.getElementById('roi-l-'+k);if(l)l.textContent=roiLab(k,ROI[k],b.dataset.u);const o=document.getElementById('roi-out');if(o)o.innerHTML=roiOut();return}
 if(b.dataset.act==='pop-notes'){POP.notes=b.value;return}
 if(b.dataset.in){DB.intake=Object.assign({},DB.intake,{[b.dataset.in]:b.value});save();const n=document.getElementById('in-count');if(n)n.textContent=inCount()+' of '+IN_Q.length+' answered';return}
 if(b.dataset.sig){DB.sig=Object.assign({},DB.sig,{[b.dataset.sig]:b.value.trim()===''&&b.dataset.sig!=='book'&&b.dataset.sig!=='li'?SIG0[b.dataset.sig]:b.value.trim()});save();sigRefresh();return}
 if(b.dataset.act==='q'){UI.q=b.value;const pos=b.selectionStart;renderMain();const el=document.querySelector('[data-act="q"]');if(el){el.focus();el.setSelectionRange(pos,pos)}}
 if(b.dataset.act==='ct-notes'){const c=CT(b.dataset.id);c.notes=b.value;save()}
 if(b.id==='dl-note')D.note=b.value});
document.addEventListener('keydown',ev=>{
 const tg0=ev.target.tagName,typing=tg0==='TEXTAREA'||tg0==='INPUT'||tg0==='SELECT';
 if(TOUR.on&&!typing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){if(ev.key==='ArrowRight'){ev.preventDefault();tourGo(1);return}if(ev.key==='ArrowLeft'){ev.preventDefault();tourGo(-1);return}}
 if(ev.key==='Escape'&&$('#modal').classList.contains('show')){closeModal();return}
 if(POP.open){if(ev.key==='Escape')closePop();else if(!typing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey&&ev.key.toLowerCase()==='d')popDial();return}
 if(ev.key==='Escape'){const was=$('#drawer').classList.contains('show')||$('#askp').classList.contains('show');closeDrawer();closeModal();$('#askp').classList.remove('show');if(D.auto){stopAuto();if(UI.view==='dialer')renderMain()}else if(TOUR.on&&!was)tourEnd();return}
 if(UI.view!=='dialer'||$('#modal').classList.contains('show')||$('#drawer').classList.contains('show'))return;
 const tg=ev.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT'||tg==='SELECT'){if(ev.key==='Enter'&&tg!=='TEXTAREA'){}return}
 if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
 const k=ev.key.toLowerCase();
 if(/^[1-8]$/.test(k)){D.out=OUTCOMES[+k-1][0];if(D.status==='ringing'){D.status='live';D.t0=Date.now()}renderMain();ev.preventDefault();return}
 if(k==='enter'||k===' '){ev.preventDefault();if(D.out)saveOutcome();else if(D.status==='idle')dial();return}
 if(k==='d'){dial();return}
 if(k==='v'){D.out='vm';saveOutcome();return}
 if(k==='s'){skip();return}
});

renderNav();renderMain();renderTick();renderScores();
setInterval(renderTick,120000);
